name: Build and Publish package
on:
  push:
    branches: [ CURE-product-master ]

  workflow_dispatch:

jobs:
  Trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Trivy Scan
        run: |
          wget -q https://raw.githubusercontent.com/Bahmni/bahmni-infra-utils/main/trivy_scan.sh && chmod +x trivy_scan.sh
          ./trivy_scan.sh
          rm trivy_scan.sh
  build-publish-package:
    name: Build and Publish package
    runs-on: ubuntu-latest
    needs: Trivy
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.CURE_EMR_ORG_ACCESS_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Build and deploy with Maven
        run: |
          PROJECT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$PROJECT_VERSION" == *"-SNAPSHOT" ]]; then
            ./mvnw --no-transfer-progress clean -U deploy -DskipTests
          else
            echo "❌ The current push is for release. So skipping build."
          fi
      - name: Delete Existing Release and Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROJECT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          release_name="Release-v${PROJECT_VERSION}.omod"
          tag_name="v${PROJECT_VERSION}.omod"

          release_id=$(curl -s -X GET -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases" | jq -r --arg release_name "$release_name" '.[] | select(.name == $release_name) | .id')

          if [ ! -z "$release_id" ] && [ "$release_id" != "null" ]; then
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/$release_id"
            echo "Deleted release $release_name"
          else
            echo "No release found for $release_name to delete."
          fi

          git push --delete origin $tag_name || echo "Tag $tag_name not found on remote."
      - name: Get project version for release
        id: get_version
        run: echo "PROJECT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.PROJECT_VERSION }}.omod
          release_name: Release-v${{ steps.get_version.outputs.PROJECT_VERSION }}.omod
          draft: false
          prerelease: false
      - name: Upload SNAPSHOT.omod to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: omod/target/fhir2Extension-${{ steps.get_version.outputs.PROJECT_VERSION }}.omod
          asset_name: fhir2Extension-${{ steps.get_version.outputs.PROJECT_VERSION }}.omod
          asset_content_type: application/octet-stream
